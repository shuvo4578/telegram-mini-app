<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>My Telegram Mini App</title>

<!-- ১. টেলিগ্রাম মিনি অ্যাপ অফিসিয়াল SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ২. Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='9841479' data-sdk='show_9841479'></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; }
  .btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #2563eb);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--tg-theme-hint-color, #999);
    color: var(--tg-theme-text-color, #000);
  }
  #status {
    margin-top: 20px;
    font-size: 14px;
    color: var(--tg-theme-hint-color, #666);
    min-height: 40px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #coins { font-size: 22px; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<h2>🎁 Watch & Earn</h2>
<div id="coins">কয়েন: <span id="coinCount">0</span></div>

<button class="btn" id="rewardedPopupBtn">বিজ্ঞাপন দেখে রিওয়ার্ড নিন (Popup)</button>
<button class="btn secondary" id="interstitialBtn">ইন্টারস্টিশিয়াল বিজ্ঞাপন দেখান</button>

<div id="status">অ্যাপ লোড হচ্ছে...</div>

<script>
  // ---------- ৩. টেলিগ্রাম Mini App ইনিশিয়ালাইজেশন ----------
  try {
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }
  } catch (e) {
    console.warn("Telegram init:", e);
  }

  const statusEl = document.getElementById('status');
  const coinCountEl = document.getElementById('coinCount');
  const rewardedBtn = document.getElementById('rewardedPopupBtn');
  const interstitialBtn = document.getElementById('interstitialBtn');

  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // SDK ফাংশন চেক
  function getAd() {
    return window.show_9841479 || window['show_9841479'];
  }

  // ---------- ৪. Monetag Rewarded Popup বাটন ----------
  rewardedBtn.addEventListener('click', () => {
    const showAd = getAd();
    if (typeof showAd !== 'function') {
      log('❌ Ad SDK এখনও রেডি হয়নি। অনুগ্রহ করে ২-৩ সেকেন্ড অপেক্ষা করে আবার চাপুন।');
      return;
    }

    rewardedBtn.disabled = true;
    log('পপআপ বিজ্ঞাপন লোড হচ্ছে, অপেক্ষা করুন...');

    // Mega-Reward এর মতো window.show_9841479('pop') কল
    showAd('pop')
      .then(() => {
        log('✅ বিজ্ঞাপন সফলভাবে ওপেন হয়েছে। রিওয়ার্ড দেওয়া হলো!');
        addReward(10);
        rewardedBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag error:', e);
        log('⚠️ এরর: ' + (e && e.message ? e.message : 'Currently not available any ads. Please wait and try again.'));
        rewardedBtn.disabled = false;
      });
  });

  // ---------- ৫. In-App Interstitial বাটন ----------
  interstitialBtn.addEventListener('click', () => {
    const showAd = getAd();
    if (typeof showAd !== 'function') {
      log('❌ Ad SDK এখনও রেডি হয়নি।');
      return;
    }

    interstitialBtn.disabled = true;
    log('ইন্টারস্টিশিয়াল বিজ্ঞাপন লোড হচ্ছে...');

    // Mega-Reward এর মতো window.show_9841479() কল
    showAd()
      .then(() => {
        log('✅ বিজ্ঞাপন দেখানো শেষ হয়েছে। রিওয়ার্ড দেওয়া হলো!');
        addReward(5);
        interstitialBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag error:', e);
        log('⚠️ এরর: ' + (e && e.message ? e.message : 'Currently not available any ads. Please wait and try again.'));
        interstitialBtn.disabled = false;
      });
  });

  // ---------- ৬. SDK লোড ভেরিফিকেশন ও পোলিং ----------
  let retrySec = 0;
  const timer = setInterval(() => {
    retrySec++;
    if (typeof getAd() === 'function') {
      clearInterval(timer);
      log('✅ অ্যাপ ও Ad SDK সম্পূর্ণ প্রস্তুত!');
    } else if (retrySec >= 10) {
      clearInterval(timer);
      log('⚠️ SDK রেসপন্স পেতে দেরি হচ্ছে। বাটন চাপলে আবার চেষ্টা করা হবে।');
    }
  }, 1000);
</script>

</body>
</html>
