<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Watch & Earn</title>

<!-- Monetag SDK (হুবহু আগের সফল পেজের মতো) -->
<script src='//libtl.com/sdk.js' data-zone='9841479' data-sdk='show_9841479'></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #121212;
    color: #ffffff;
    padding: 24px;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .container {
    width: 100%;
    max-width: 360px;
    background-color: #1e1e1e;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  h2 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #ff8c00;
  }
  .subtext {
    font-size: 14px;
    color: #888;
    margin-bottom: 20px;
  }
  .coins-box {
    background-color: #2c2c2c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 26px;
    font-weight: bold;
    color: #ff8c00;
  }
  .btn {
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s;
  }
  .btn:active {
    transform: scale(0.97);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-popup {
    background-color: #ff8c00;
    color: #121212;
  }
  .btn-interstitial {
    background-color: transparent;
    border: 2px solid #ff8c00;
    color: #ff8c00;
  }
  #status {
    margin-top: 20px;
    font-size: 13px;
    color: #aaa;
    min-height: 35px;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="container">
  <h2>🎁 Watch & Earn</h2>
  <p class="subtext">বিজ্ঞাপন দেখে রিওয়ার্ড কয়েন সংগ্রহ করুন</p>

  <div class="coins-box">
    কয়েন: <span id="coinCount">0</span>
  </div>

  <!-- বাটন ১: Rewarded Popup -->
  <button class="btn btn-popup" id="popupBtn">বিজ্ঞাপন দেখে রিওয়ার্ড নিন (Popup)</button>

  <!-- বাটন ২: Rewarded Interstitial -->
  <button class="btn btn-interstitial" id="interstitialBtn">ইন্টারস্টিশিয়াল বিজ্ঞাপন দেখান</button>

  <div id="status">লোড হচ্ছে...</div>
</div>

<script>
  const statusEl = document.getElementById('status');
  const coinCountEl = document.getElementById('coinCount');
  const popupBtn = document.getElementById('popupBtn');
  const interstitialBtn = document.getElementById('interstitialBtn');

  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // ১. Rewarded Popup (আগের পেজের হুবহু মেথড)
  popupBtn.addEventListener('click', () => {
    if (typeof window.show_9841479 !== 'function') {
      log('❌ বিজ্ঞাপন লোড হয়নি, একটু অপেক্ষা করে আবার চেষ্টা করুন।');
      return;
    }

    popupBtn.disabled = true;
    log('পপআপ বিজ্ঞাপন ওপেন হচ্ছে...');

    window.show_9841479('pop')
      .then(() => {
        log('✅ বিজ্ঞাপন সম্পন্ন! +১০ কয়েন যোগ হয়েছে।');
        addReward(10);
        popupBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag Popup Error:', e);
        log('⚠️ কোনো বিজ্ঞাপন পাওয়া যায়নি, একটু পর আবার চেষ্টা করুন।');
        popupBtn.disabled = false;
      });
  });

  // ২. Rewarded Interstitial (আগের পেজের হুবহু মেথড)
  interstitialBtn.addEventListener('click', () => {
    if (typeof window.show_9841479 !== 'function') {
      log('❌ বিজ্ঞাপন লোড হয়নি, একটু অপেক্ষা করে আবার চেষ্টা করুন।');
      return;
    }

    interstitialBtn.disabled = true;
    log('ইন্টারস্টিশিয়াল বিজ্ঞাপন লোড হচ্ছে...');

    window.show_9841479()
      .then(() => {
        log('✅ বিজ্ঞাপন সম্পন্ন! +৫ কয়েন যোগ হয়েছে।');
        addReward(5);
        interstitialBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag Interstitial Error:', e);
        log('⚠️ কোনো বিজ্ঞাপন পাওয়া যায়নি, একটু পর আবার চেষ্টা করুন।');
        interstitialBtn.disabled = false;
      });
  });

  // পেজ লোড হলে চেক
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (typeof window.show_9841479 === 'function') {
        log('✅ রেডি! বাটনে ক্লিক করে বিজ্ঞাপন দেখুন।');
      } else {
        log('⚠️ অ্যাড সার্ভিস লোড হতে সময় নিচ্ছে...');
      }
    }, 1000);
  });
</script>

</body>
</html>
