<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Watch & Earn</title>

<!-- টেলিগ্রাম Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="9841479" data-sdk="show_9841479"></script>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #ffffff;
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; color: #ff8c00; }
  .card {
    background: #1e1e1e;
    border-radius: 16px;
    padding: 20px;
    max-width: 360px;
    margin: 20px auto;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #333;
  }
  .btn {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-orange { background: #ff8c00; color: #121212; }
  .btn-green { background: #10b981; color: #ffffff; }
  #coins { font-size: 26px; font-weight: bold; margin: 15px 0; color: #ff8c00; }
  #status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #2a2a2a;
    font-size: 13px;
    min-height: 50px;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #444;
  }
</style>
</head>
<body>

<div class="card">
  <h2>🎁 Watch & Earn</h2>
  <div id="coins">কয়েন: <span id="coinCount">0</span></div>

  <button class="btn btn-orange" id="interstitialBtn">🎬 Rewarded Interstitial</button>
  <button class="btn btn-green" id="popupBtn">🚀 Rewarded Popup</button>

  <div id="status">স্ট্যাটাস চেক হচ্ছে...</div>
</div>

<script>
  // টেলিগ্রাম ইনিশিয়ালাইজেশন
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  } catch (e) {
    console.warn("Telegram init warning:", e);
  }

  const statusEl = document.getElementById("status");
  const coinCountEl = document.getElementById("coinCount");
  const interstitialBtn = document.getElementById("interstitialBtn");
  const popupBtn = document.getElementById("popupBtn");

  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // SDK হেল্পার ফাংশন
  function getAdFunction() {
    return window.show_9841479 || window["show_9841479"];
  }

  // ১. Rewarded Interstitial
  interstitialBtn.addEventListener("click", function() {
    const showAd = getAdFunction();
    if (typeof showAd !== "function") {
      log("❌ show_9841479 ফাংশন এখনও পাওয়া যায়নি।\nSDK স্টেট: " + typeof showAd);
      return;
    }

    interstitialBtn.disabled = true;
    log("বিজ্ঞাপন লোড হচ্ছে...");

    showAd()
      .then(function(res) {
        addReward(10);
        log("✅ বিজ্ঞাপন সফলভাবে দেখা হয়েছে! +১০ কয়েন যোগ হয়েছে।");
        alert("You have seen an ad!");
        interstitialBtn.disabled = false;
      })
      .catch(function(err) {
        console.error("Interstitial Error:", err);
        const errMsg = (err && err.message) ? err.message : String(err);
        log("⚠️ Interstitial Error: " + errMsg);
        interstitialBtn.disabled = false;
      });
  });

  // ২. Rewarded Popup
  popupBtn.addEventListener("click", function() {
    const showAd = getAdFunction();
    if (typeof showAd !== "function") {
      log("❌ show_9841479 ফাংশন পাওয়া যায়নি।");
      return;
    }

    popupBtn.disabled = true;
    log("পপআপ বিজ্ঞাপন ওপেন হচ্ছে...");

    showAd("pop")
      .then(function(res) {
        addReward(10);
        log("✅ পপআপ বিজ্ঞাপন সফলভাবে দেখা হয়েছে! +১০ কয়েন যোগ হয়েছে।");
        popupBtn.disabled = false;
      })
      .catch(function(err) {
        console.error("Popup Error:", err);
        const errMsg = (err && err.message) ? err.message : String(err);
        log("⚠️ Popup Error: " + errMsg);
        popupBtn.disabled = false;
      });
  });

  // পেজ লোড এবং SDK রেডি চেক পোলিং (Polling loop)
  let checkCount = 0;
  const pollInterval = setInterval(function() {
    checkCount++;
    const showAd = getAdFunction();
    if (typeof showAd === "function") {
      clearInterval(pollInterval);
      log("✅ Monetag SDK প্রস্তুত! (show_9841479 Available)");
    } else if (checkCount >= 15) {
      clearInterval(pollInterval);
      log("❌ Monetag SDK লোড হয়নি (টাইমআউট)।\nকনসোলে নেটওয়ার্ক/ডোমেন রেসপন্স চেক করুন।");
    } else {
      log("SDK লোড হওয়ার অপেক্ষা (" + checkCount + "/15)...");
    }
  }, 1000);
</script>

</body>
</html>
