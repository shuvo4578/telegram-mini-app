<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Watch & Earn</title>

<!-- টেলিগ্রাম Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="9841479" data-sdk="show_9841479"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #121212;
    color: #ffffff;
    padding: 20px;
    text-align: center;
  }
  .card {
    background: #1e1e1e;
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    margin: 20px auto;
    border: 1px solid #333;
  }
  h2 { margin: 0 0 10px 0; color: #ff8c00; font-size: 24px; }
  .coins { font-size: 26px; font-weight: bold; margin: 15px 0; color: #ff8c00; }
  .btn {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.1s transform;
  }
  .btn:active { transform: scale(0.98); }
  .btn-interstitial { background: #ff8c00; color: #121212; }
  .btn-popup { background: #10b981; color: #ffffff; }
  #status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #282828;
    font-size: 13px;
    min-height: 40px;
    white-space: pre-wrap;
    word-break: break-word;
    border: 1px solid #444;
    color: #00ffcc;
  }
</style>
</head>
<body>

<div class="card">
  <h2>🎁 Watch & Earn</h2>
  <div class="coins">কয়েন: <span id="coinCount">0</span></div>

  <button class="btn btn-interstitial" id="interstitialBtn">🎬 Rewarded Interstitial</button>
  <button class="btn btn-popup" id="popupBtn">🚀 Rewarded Popup</button>

  <div id="status">অ্যাপ লোড হচ্ছে...</div>
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const statusEl = document.getElementById("status");
  const coinCountEl = document.getElementById("coinCount");
  const interstitialBtn = document.getElementById("interstitialBtn");
  const popupBtn = document.getElementById("popupBtn");

  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // ১. Rewarded Interstitial (হুবহু স্ক্রিনশটের কোড)
  interstitialBtn.addEventListener("click", function() {
    if (typeof show_9841479 !== "function") {
      log("❌ show_9841479 ফাংশন পাওয়া যায়নি! SDK লোড হয়নি।");
      return;
    }

    log("বিজ্ঞাপন লোড হচ্ছে, অপেক্ষা করুন...");

    show_9841479()
      .then(function() {
        addReward(10);
        log("✅ বিজ্ঞাপন সফলভাবে দেখা হয়েছে! +১০ কয়েন যোগ হয়েছে।");
        alert("You have seen an ad!");
      })
      .catch(function(e) {
        console.error("Monetag Interstitial error:", e);
        log("⚠️ Interstitial এরর: " + (e && e.message ? e.message : JSON.stringify(e)));
      });
  });

  // ২. Rewarded Popup (হুবহু স্ক্রিনশটের কোড)
  popupBtn.addEventListener("click", function() {
    if (typeof show_9841479 !== "function") {
      log("❌ show_9841479 ফাংশন পাওয়া যায়নি! SDK লোড হয়নি।");
      return;
    }

    log("পপআপ বিজ্ঞাপন ওপেন হচ্ছে...");

    show_9841479("pop")
      .then(function() {
        addReward(10);
        log("✅ পপআপ সফলভাবে ট্রিগার হয়েছে! +১০ কয়েন যোগ হয়েছে।");
      })
      .catch(function(e) {
        console.error("Monetag Popup error:", e);
        log("⚠️ Popup এরর: " + (e && e.message ? e.message : JSON.stringify(e)));
      });
  });

  // SDK লোড স্ট্যাটাস চেক
  window.addEventListener("load", function() {
    setTimeout(function() {
      if (typeof show_9841479 === "function") {
        log("✅ Monetag SDK প্রস্তুত! বাটন চাপুন।");
      } else {
        log("❌ Monetag SDK লোড হয়নি! (show_9841479 undefined)");
      }
    }, 1200);
  });
</script>

</body>
</html>
