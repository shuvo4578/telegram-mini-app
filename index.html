<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Telegram Mini App</title>

<!-- ১. টেলিগ্রাম মিনি অ্যাপ অফিসিয়াল SDK (অবশ্যই লাগবে) -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ২. Monetag SDK — নিচের data-zone এ আপনার নিজের জোন আইডি বসান -->
<script src='//libtl.com/sdk.js' data-zone='9841479' data-sdk='show_9841479'></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; }
  .btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #2563eb);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.secondary {
    background: transparent;
    border: 1px solid var(--tg-theme-hint-color, #999);
    color: var(--tg-theme-text-color, #000);
  }
  #status {
    margin-top: 20px;
    font-size: 14px;
    color: var(--tg-theme-hint-color, #666);
    min-height: 40px;
    white-space: pre-wrap;
  }
  #coins { font-size: 22px; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<h2>🎁 Watch & Earn</h2>
<div id="coins">কয়েন: <span id="coinCount">0</span></div>

<button class="btn" id="rewardedPopupBtn">বিজ্ঞাপন দেখে রিওয়ার্ড নিন (Popup)</button>
<button class="btn secondary" id="interstitialBtn">ইন্টারস্টিশিয়াল বিজ্ঞাপন দেখান</button>

<div id="status">অ্যাপ লোড হচ্ছে...</div>

<script>
  // ---------- ৩. টেলিগ্রাম Mini App ইনিশিয়ালাইজেশন ----------
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();     // টেলিগ্রামকে জানায় অ্যাপ প্রস্তুত, লোডিং স্প্ল্যাশ সরিয়ে দেয়
    tg.expand();    // ফুলস্ক্রিনে অ্যাপ ওপেন করে
  }

  const statusEl = document.getElementById('status');
  const coinCountEl = document.getElementById('coinCount');
  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
    // এখানে আপনি চাইলে ব্যাকএন্ড API কল করে ইউজারের কয়েন সেভ করতে পারবেন
    // fetch('https://yourserver.com/api/reward', { method: 'POST', body: JSON.stringify({ userId: tg?.initDataUnsafe?.user?.id, amount }) })
  }

  // ---------- ৪. Monetag Rewarded Popup বাটন ----------
  const rewardedBtn = document.getElementById('rewardedPopupBtn');

  rewardedBtn.addEventListener('click', () => {
    if (typeof show_9841479 !== 'function') {
      log('❌ Ad SDK লোড হয়নি। ইন্টারনেট কানেকশন বা অ্যাডব্লকার চেক করুন।');
      return;
    }

    rewardedBtn.disabled = true;
    log('বিজ্ঞাপন লোড হচ্ছে, একটু অপেক্ষা করুন...');

    show_9841479('pop')
      .then(() => {
        log('✅ বিজ্ঞাপন সফলভাবে ওপেন হয়েছে। রিওয়ার্ড দেওয়া হলো!');
        addReward(10);
        rewardedBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag error:', e);
        log('⚠️ এরর: ' + (e && e.message ? e.message : String(e)) + '\n(F12 চেপে কনসোলে বিস্তারিত দেখুন)');
        rewardedBtn.disabled = false;
      });
  });

  // ---------- ৫. In-App Interstitial বাটন (ঐচ্ছিক ফরম্যাট) ----------
  const interstitialBtn = document.getElementById('interstitialBtn');

  interstitialBtn.addEventListener('click', () => {
    if (typeof show_9841479 !== 'function') {
      log('❌ Ad SDK লোড হয়নি।');
      return;
    }

    interstitialBtn.disabled = true;
    log('ইন্টারস্টিশিয়াল বিজ্ঞাপন লোড হচ্ছে...');
show_9841479()
      .then(() => {
        log('✅ বিজ্ঞাপন দেখানো শেষ হয়েছে। রিওয়ার্ড দেওয়া হলো!');
        addReward(5);
        interstitialBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag error:', e);
        log('⚠️ এরর: ' + (e && e.message ? e.message : String(e)));
        interstitialBtn.disabled = false;
      });
  });

  // ---------- ৬. পেইজ লোড শেষে SDK চেক ----------
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (typeof show_9841479 === 'function') {
        log('✅ অ্যাপ ও Ad SDK প্রস্তুত।');
      } else {
        log('❌ Monetag SDK লোড হয়নি — zone ID বা ইন্টারনেট চেক করুন।');
      }
    }, 1500);
  });
</script>

</body>
</html>
