<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Telegram Mini App</title>

<!-- টেলিগ্রাম মিনি অ্যাপ অফিসিয়াল SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src='//libtl.com/sdk.js' data-zone='9841479' data-sdk='show_9841479'></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; }
  .btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    margin: 12px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #2563eb);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #status {
    margin-top: 20px;
    font-size: 14px;
    color: var(--tg-theme-hint-color, #666);
    min-height: 40px;
    white-space: pre-wrap;
  }
  #coins { font-size: 26px; font-weight: bold; margin: 15px 0; color: #2563eb; }
</style>
</head>
<body>

<h2>🎁 Watch & Earn</h2>
<div id="coins">💰 কয়েন: <span id="coinCount">0</span></div>

<button class="btn" id="rewardedBtn">বিজ্ঞাপন দেখুন এবং রিওয়ার্ড নিন</button>

<div id="status">অ্যাপ লোড হচ্ছে...</div>

<script>
  // টেলিগ্রাম Mini App ইনিশিয়ালাইজেশন
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const statusEl = document.getElementById('status');
  const coinCountEl = document.getElementById('coinCount');
  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  const rewardedBtn = document.getElementById('rewardedBtn');

  rewardedBtn.addEventListener('click', () => {
    if (typeof show_9841479 !== 'function') {
      log('❌ Ad SDK লোড হয়নি। ইন্টারনেট বা অ্যাডব্লকার চেক করুন।');
      return;
    }

    rewardedBtn.disabled = true;
    log('বিজ্ঞাপন লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...');

    // Monetag Rewarded Interstitial Call
    show_9841479()
      .then(() => {
        // রিওয়ার্ড যোগ করা
        addReward(10);
        log('✅ আপনি সম্পূর্ণ বিজ্ঞাপনটি দেখেছেন! +১০ কয়েন যোগ হয়েছে।');
        alert('You have seen an ad! +10 Coins Added!');
        rewardedBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag error:', e);
        log('⚠️ এরর: ' + (e && e.message ? e.message : String(e)));
        rewardedBtn.disabled = false;
      });
  });

  // পেইজ লোড শেষে SDK চেক
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (typeof show_9841479 === 'function') {
        log('✅ অ্যাপ ও Ad SDK প্রস্তুত।');
      } else {
        log('❌ Monetag SDK লোড হয়নি — zone ID বা ইন্টারনেট চেক করুন।');
      }
    }, 1200);
  });
</script>

</body>
</html>
