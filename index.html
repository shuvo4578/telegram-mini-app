<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram Mini App</title>

<!-- ১. অফিসিয়াল টেলিগ্রাম Mini App SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ২. Monetag SDK -->
<script src="//libtl.com/sdk.js" data-zone="9841479" data-sdk="show_9841479"></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; }
  .btn {
    width: 100%;
    max-width: 320px;
    padding: 14px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: var(--tg-theme-button-color, #2563eb);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
  }
  .btn.secondary {
    background: #10b981;
    color: #ffffff;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #coins { font-size: 24px; font-weight: bold; margin: 15px 0; }
  #status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(128,128,128,0.1);
    font-size: 14px;
    min-height: 45px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>

<h2>🎁 Watch & Earn</h2>
<div id="coins">কয়েন: <span id="coinCount">0</span></div>

<!-- বাটন ১: Rewarded Interstitial -->
<button class="btn" id="rewardedBtn">🎬 Rewarded Interstitial</button>

<!-- বাটন ২: Rewarded Popup -->
<button class="btn secondary" id="popupBtn">🚀 Rewarded Popup</button>

<div id="status">অ্যাপ লোড হচ্ছে...</div>

<script>
  // টেলিগ্রাম WebApp শুরু
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const statusEl = document.getElementById('status');
  const coinCountEl = document.getElementById('coinCount');
  const rewardedBtn = document.getElementById('rewardedBtn');
  const popupBtn = document.getElementById('popupBtn');

  let coins = 0;

  function log(msg) {
    statusEl.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // ১. Rewarded Interstitial
  rewardedBtn.addEventListener('click', () => {
    if (typeof show_9841479 !== 'function') {
      log('❌ Monetag SDK লোড হয়নি।');
      return;
    }

    rewardedBtn.disabled = true;
    log('বিজ্ঞাপন লোড হচ্ছে, অপেক্ষা করুন...');

    show_9841479()
      .then((result) => {
        addReward(10);
        log('✅ বিজ্ঞাপন সফলভাবে দেখা হয়েছে! +১০ কয়েন যোগ হয়েছে।');
        alert('You have seen an ad!');
        rewardedBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag Interstitial error:', e);
        const errMsg = (e && e.message) ? e.message : String(e);
        log('⚠️ Interstitial এরর: ' + errMsg);
        rewardedBtn.disabled = false;
      });
  });

  // ২. Rewarded Popup
  popupBtn.addEventListener('click', () => {
    if (typeof show_9841479 !== 'function') {
      log('❌ Monetag SDK লোড হয়নি।');
      return;
    }

    popupBtn.disabled = true;
    log('পপআপ বিজ্ঞাপন লোড হচ্ছে...');

    show_9841479('pop')
      .then((result) => {
        addReward(10);
        log('✅ পপআপ বিজ্ঞাপন ট্রিগার হয়েছে! +১০ কয়েন যোগ হয়েছে।');
        popupBtn.disabled = false;
      })
      .catch((e) => {
        console.error('Monetag Popup error:', e);
        const errMsg = (e && e.message) ? e.message : String(e);
        log('⚠️ Popup এরর: ' + errMsg);
        popupBtn.disabled = false;
      });
  });

  // পেজ লোড শেষে SDK ভেরিফিকেশন
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (typeof show_9841479 === 'function') {
        log('✅ Monetag SDK প্রস্তুত। বাটনে ক্লিক করুন।');
      } else {
        log('❌ Monetag SDK লোড হয়নি।');
      }
    }, 1000);
  });
</script>

</body>
</html>
