<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telegram Mini App - Monetag Ads</title>

<!-- ১. টেলিগ্রাম অফিসিয়াল WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ২. Monetag SDK (https:// সরাসরি উল্লেখ করা নিরাপদ) -->
<script src="https://libtl.com/sdk.js" data-zone="9841479" data-sdk="show_9841479"></script>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #181818);
    color: var(--tg-theme-text-color, #ffffff);
    padding: 20px;
    text-align: center;
  }
  h2 { margin-top: 10px; margin-bottom: 5px; }
  .card {
    background: var(--tg-theme-secondary-bg-color, #242424);
    border-radius: 16px;
    padding: 20px;
    margin: 15px auto;
    max-width: 360px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .coins {
    font-size: 28px;
    font-weight: bold;
    color: #fbbf24;
    margin: 10px 0 20px 0;
  }
  .btn {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s opacity;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-interstitial {
    background: #3b82f6;
    color: #ffffff;
  }
  .btn-popup {
    background: #10b981;
    color: #ffffff;
  }
  #status-box {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(0,0,0,0.3);
    font-size: 13px;
    min-height: 50px;
    white-space: pre-wrap;
    word-break: break-word;
  }
</style>
</head>
<body>

<div class="card">
  <h2>🎁 Watch & Earn</h2>
  <p style="opacity:0.8;font-size:13px;margin:0;">বিজ্ঞাপন দেখে কয়েন সংগ্রহ করুন</p>

  <div class="coins">💰 <span id="coinCount">0</span> কয়েন</div>

  <!-- Format 1: Rewarded Interstitial -->
  <button class="btn btn-interstitial" id="interstitialBtn">
    🎬 Rewarded Interstitial (+10)
  </button>

  <!-- Format 2: Rewarded Popup -->
  <button class="btn btn-popup" id="popupBtn">
    🚀 Rewarded Popup (+10)
  </button>

  <div id="status-box">অ্যাপ ও Monetag SDK লোড হচ্ছে...</div>
</div>

<script>
  // টেলিগ্রাম Mini App শুরু
  const tg = window.Telegram?.WebApp;
  let telegramUserId = null;

  if (tg) {
    tg.ready();
    tg.expand();
    telegramUserId = tg.initDataUnsafe?.user?.id || null;
  }

  const statusBox = document.getElementById("status-box");
  const coinCountEl = document.getElementById("coinCount");
  const interstitialBtn = document.getElementById("interstitialBtn");
  const popupBtn = document.getElementById("popupBtn");

  let coins = 0;

  function log(msg) {
    statusBox.textContent = msg;
    console.log(msg);
  }

  function addReward(amount) {
    coins += amount;
    coinCountEl.textContent = coins;
  }

  // SDK রেডি আছে কিনা চেক ও Preload
  function checkAndPreload() {
    if (typeof show_9841479 === "function") {
      log("✅ Monetag SDK প্রস্তুত! অ্যাড প্রিলোড হচ্ছে...");
      
      // ডকস অনুযায়ী background-এ preload করা
      show_9841479({ type: "preload", ymid: telegramUserId ? String(telegramUserId) : "tma_user" })
        .then(() => {
          log("✅ অ্যাড সফলভাবে প্রিলোড হয়েছে। বাটন চাপুন।");
        })
        .catch((err) => {
          log("ℹ️ প্রিলোড নোটিস: " + (err && err.message ? err.message : "কোনো অ্যাড ফিড নেই"));
        });
    } else {
      log("❌ Ad SDK লোড হয়নি! (AdBlocker/Private DNS বন্ধ করুন বা VPN দিয়ে চেক করুন)");
    }
  }

  // ১. Rewarded Interstitial বাটন (Docs অনুযায়ী)
  interstitialBtn.addEventListener("click", () => {
    if (typeof show_9841479 !== "function") {
      log("❌ SDK লোড হয়নি। আপনার ব্রাউজার বা নেটওয়ার্কে AdBlocker আছে।");
      return;
    }

    interstitialBtn.disabled = true;
    log("⏳ ইন্টারস্টিশিয়াল বিজ্ঞাপন ওপেন হচ্ছে...");

    show_9841479({ type: "end", ymid: telegramUserId ? String(telegramUserId) : "tma_user" })
      .then((res) => {
        addReward(10);
        log("✅ বিজ্ঞাপন সম্পন্ন! +১০ কয়েন যুক্ত হয়েছে।");
        alert("অভিনন্দন! আপনি পুরো বিজ্ঞাপন দেখেছেন। +১০ কয়েন পেয়েছেন!");
        interstitialBtn.disabled = false;
      })
      .catch((err) => {
        console.error(err);
        const errMsg = err && err.message ? err.message : String(err);
        log("⚠️ Ad Error: " + errMsg);
        interstitialBtn.disabled = false;
      });
  });

  // ২. Rewarded Popup বাটন (Docs অনুযায়ী)
  popupBtn.addEventListener("click", () => {
    if (typeof show_9841479 !== "function") {
      log("❌ SDK লোড হয়নি। আপনার ব্রাউজার বা নেটওয়ার্কে AdBlocker আছে।");
      return;
    }

    popupBtn.disabled = true;
    log("⏳ পপআপ বিজ্ঞাপন ওপেন হচ্ছে...");

    show_9841479({ type: "pop", ymid: telegramUserId ? String(telegramUserId) : "tma_user" })
      .then(() => {
        addReward(10);
        log("✅ পপআপ সফলভাবে ট্রিগার হয়েছে! +১০ কয়েন যুক্ত হয়েছে।");
        popupBtn.disabled = false;
      })
      .catch((err) => {
        console.error(err);
        const errMsg = err && err.message ? err.message : String(err);
        log("⚠️ Popup Error: " + errMsg);
        popupBtn.disabled = false;
      });
  });

  // পেজ লোড হলে চেক চালানো
  window.addEventListener("load", () => {
    setTimeout(checkAndPreload, 1500);
  });
</script>

</body>
</html>
